<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Menú</title>
  <link rel="stylesheet" href="./1.css" />
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <header>
      <div class="header-inner">
        <a class="brand" href="menu.html">Mi Proyecto</a>

        <nav class="top-nav">
          <a href="menu.html">Menú</a>
          <a href="pokedex.html">Pokédex</a>
          <a href="perfil.html">Perfil</a>
          <a href="acerca.html">Acerca</a>
          <a href="contacto.html">Contacto</a>
          <a class="danger" href="#" onclick="logout()">Cerrar sesión</a>
        </nav>
      </div>
    </header>

    <section class="battle-menu-box">
  <h2>Batalla Pokémon</h2>
  <p>Elige dos Pokémon para comenzar la pelea.</p>

  <div class="battle-form">
    <input type="text" id="pokemon1" list="pokemon-list" placeholder="Pokémon 1 (ej: pikachu)" />
    <input type="text" id="pokemon2" list="pokemon-list" placeholder="Pokémon 2 (ej: charizard)" />
    <datalist id="pokemon-list"></datalist>
    <button id="btnBattle" type="button">Comenzar pelea</button>
  </div>

  <p id="battleStatus" class="battle-status"></p>
</section>

    <!-- CONTENIDO -->
    <main>
      <div class="card">
        <h2>Menú</h2>

        <p style="margin-top:0;">
          Sesión activa: <b id="userEmail"></b>
        </p>

        <nav class="menu">
          <a class="menu-item" href="pokedex.html">Pokédex</a>
          <a class="menu-item" href="perfil.html">Perfil</a>
          <a class="menu-item" href="acerca.html">Acerca</a>
          <a class="menu-item" href="contacto.html">Contacto</a>
        </nav>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-inner">
        <span>© 2026 Mi Proyecto</span>
        <span>Menú demo</span>
      </div>
    </footer>

  </div>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    showUserEmail("userEmail");

    function normalizePokemonName(value) {
      return (value || "").trim().toLowerCase().replace(/\s+/g, "-");
    }

    function setBattleStatus(text, isError = false) {
      const el = document.getElementById("battleStatus");
      if (!el) return;
      el.textContent = text;
      el.className = isError ? "battle-status error" : "battle-status";
    }

    function initBattleMenu() {
      const input1 = document.getElementById("pokemon1");
      const input2 = document.getElementById("pokemon2");
      const btn = document.getElementById("btnBattle");

      if (!input1 || !input2 || !btn) {
        console.error("No se encontraron pokemon1, pokemon2 o btnBattle");
        return;
      }

      btn.addEventListener("click", () => {
        const pokemon1 = normalizePokemonName(input1.value);
        const pokemon2 = normalizePokemonName(input2.value);

        if (!pokemon1 || !pokemon2) {
          setBattleStatus("Escribe los dos Pokémon.", true);
          return;
        }

        if (pokemon1 === pokemon2) {
          setBattleStatus("Elige dos Pokémon diferentes.", true);
          return;
        }

        localStorage.setItem(
          "battlePokemonNames",
          JSON.stringify({ pokemon1, pokemon2 })
        );

        setBattleStatus("Abriendo pelea...");
        window.location.href = "pelea.html";
      });
    }

    initBattleMenu();
  </script>
</body>
</html>

<script>
  requireAuth();
  showUserEmail("userEmail");

  function normalizePokemonName(value) {
    return (value || "").trim().toLowerCase().replace(/\s+/g, "-");
  }

  function setBattleStatus(text, isError = false) {
    const el = document.getElementById("battleStatus");
    if (!el) return;
    el.textContent = text;
    el.className = isError ? "battle-status error" : "battle-status";
  }

  async function loadPokemonList() {
    const datalist = document.getElementById("pokemon-list");
    if (!datalist) return;

    try {
      const response = await fetch("https://pokeapi.co/api/v2/pokemon?limit=1025");
      const data = await response.json();

      datalist.innerHTML = data.results
        .map(pokemon => `<option value="${pokemon.name}"></option>`)
        .join("");
    } catch (error) {
      console.error("No se pudo cargar la lista de Pokémon:", error);
    }
  }

  function initBattleMenu() {
    const input1 = document.getElementById("pokemon1");
    const input2 = document.getElementById("pokemon2");
    const btn = document.getElementById("btnBattle");

    if (!input1 || !input2 || !btn) {
      console.error("No se encontraron pokemon1, pokemon2 o btnBattle");
      return;
    }

    btn.addEventListener("click", () => {
      const pokemon1 = normalizePokemonName(input1.value);
      const pokemon2 = normalizePokemonName(input2.value);

      if (!pokemon1 || !pokemon2) {
        setBattleStatus("Escribe los dos Pokémon.", true);
        return;
      }

      if (pokemon1 === pokemon2) {
        setBattleStatus("Elige dos Pokémon diferentes.", true);
        return;
      }

      localStorage.setItem(
        "battlePokemonNames",
        JSON.stringify({ pokemon1, pokemon2 })
      );

      setBattleStatus("Abriendo pelea...");
      window.location.href = "pelea.html";
    });
  }

  loadPokemonList();
  initBattleMenu();
</script>
