<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="1.css" />
</head>

<body class="auth">
  <div class="page">

    <header>
      <div class="header-inner">
        <a class="brand" href="Login.html">Mi Proyecto</a>
        <nav class="top-nav">
          <a href="acerca.html">Acerca</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <main>
      <form id="loginForm">
        <h2>Iniciar Sesión</h2>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="demo@demo.com" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="1234" />

        <p id="errorMsg" style="display:none; color:#dc2626; font-weight:600; margin-top:0;">
          Correo o contraseña incorrectos.
        </p>

        <button type="submit">Entrar</button>

        <p>¿No tienes cuenta?</p>

        <button type="button" onclick="location.href='Registro.html'">
          Crear cuenta
        </button>
      </form>
    </main>

    <footer>
      <div class="footer-inner">
        <span>© 2026 Mi Proyecto</span>
        <span>Login funcional demo</span>
      </div>
    </footer>

  </div>

  <script>
    // Credenciales demo
    const DEMO_EMAIL = "demo@demo.com";
    const DEMO_PASS  = "1234";

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const pass  = document.getElementById("password").value;

      if (email === DEMO_EMAIL && pass === DEMO_PASS) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userEmail", email);
        window.location.href = "menu.html";
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
