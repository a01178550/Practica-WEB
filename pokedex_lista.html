<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="1.css" />
</head>

<body>
  <div class="page">

    <header>
      <div class="header-inner">
        <a class="brand" href="menu.html">Mi Proyecto</a>

        <nav class="top-nav">
          <a href="menu.html">Menú</a>
          <a href="pokedex.html">Pokédex</a>
          <a href="pokedex_lista.html">Pokédex Lista</a>
          <a href="perfil.html">Perfil</a>
          <a href="acerca.html">Acerca</a>
          <a href="contacto.html">Contacto</a>
          <a class="danger" href="#" onclick="logout()">Cerrar sesión</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="card">
        <h2>Pokédex</h2>

        <div class="pokedex-wrap">

          <div class="pokedex-panel">
            <h3>Buscar Pokémon</h3>

            <div class="inline">
              <input id="pokemonName" type="text" placeholder="Ej: pikachu o 25" />
              <button id="btnSearch" class="btn-primary" type="button">Buscar</button>
            </div>

            <div class="helper">
              Tip: funciona con ID (<b>25</b>) o nombre (<b>pikachu</b>).
            </div>

            <div id="status" class="status">Listo.</div>

            <button class="btn-secondary" type="button" onclick="location.href='menu.html'">
              Volver al menú
            </button>
          </div>

          <div id="pokemon-container"></div>

        </div>

      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <span>© 2026 Mi Proyecto</span>
        <span>Pokédex demo</span>
      </div>
    </footer>

  </div>

  <script src="auth.js"></script>
  <script src="pokemon.js"></script>
  <script>
    requireAuth();

    // Si vienes desde la lista: pokedex.html?id=25
    const params = new URLSearchParams(window.location.search);
    const idFromUrl = params.get("id");

    // Si no viene id, dejamos un default
    initPokemonPage(idFromUrl || "ditto");
  </script>
</body>
</html>
